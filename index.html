<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리스타트 교육과정 일정표</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root {
  --ulim:         #0F6E56; --ulim-bg:   #E1F5EE; --ulim-bd:   #5DCAA5;
  --sabujak:      #3C3489; --sabujak-bg:#EEEDFE; --sabujak-bd:#AFA9EC;
  --woori:        #633806; --woori-bg:  #FAEEDA; --woori-bd:  #EF9F27;
  --saenghyup:    #27500A; --saenghyup-bg:#EAF3DE;--saenghyup-bd:#97C459;
  --common:       #0C447C; --common-bg: #E6F1FB; --common-bd: #85B7EB;
  --mapo:         #8B1A4A; --mapo-bg:   #FDE8F0; --mapo-bd:   #E07AAF;
  --border:       #e4e4e0;
  --border-light: #f0f0ec;
  --text:         #1a1a1a;
  --muted:        #6b7280;
  --hint:         #9ca3af;
  --bg:           #f5f5f2;
  --white:        #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.top-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 13px 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.top-bar h1 { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.02em; flex: 1; }
.top-bar p  { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

.layout {
  display: flex;
  height: calc(100vh - 49px);
}

/* 왼쪽 캘린더 */
.left-panel {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 18px 40px;
  border-right: 1px solid var(--border);
}

/* 오른쪽 패널 */
.right-panel {
  width: 340px;
  flex-shrink: 0;
  overflow-y: auto;
  background: var(--white);
}

/* 범례 / 카테고리 탭 */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.68rem;
  color: var(--muted);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.legend-item:hover { background: #f0f0ec; color: var(--text); }
.legend-item.active { color: var(--white); border-color: transparent; }

.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* 기관 소개글 */
.panel-desc {
  font-size: 0.73rem;
  color: var(--muted);
  line-height: 1.7;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 7px;
  border: 1px solid var(--border-light);
  margin-bottom: 14px;
  font-style: italic;
}

.panel-desc-placeholder {
  font-size: 0.68rem;
  color: var(--hint);
  line-height: 1.6;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 7px;
  border: 1px dashed var(--border);
  margin-bottom: 14px;
  text-align: center;
}

/* 세션 클릭 */
.session-item { cursor: pointer; }
.session-item:hover:not(.active-session) { background: #eeeee9; }
.month-nav { display: flex; gap: 5px; margin-bottom: 10px; }

.month-btn {
  padding: 5px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--white);
  font-size: 0.78rem;
  font-family: inherit;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.1s;
}

.month-btn:hover { background: #f0f0ec; }
.month-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

/* 캘린더 */
.cal-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.cal-head-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: #fafaf8;
  border-bottom: 1px solid var(--border);
}

.cal-head-cell {
  padding: 8px 0;
  text-align: center;
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--muted);
}

.cal-head-cell.sun { color: #dc2626; }
.cal-head-cell.sat { color: #2563eb; }

.cal-body-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-cell {
  min-height: 90px;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  padding: 5px;
}

.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell.other { background: #fafaf9; }

.day-num {
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--muted);
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  margin-bottom: 3px;
}

.day-num.sun   { color: #dc2626; }
.day-num.sat   { color: #2563eb; }
.day-num.other { color: #d1d5db; }

.ev-chip {
  display: block;
  font-size: 0.62rem;
  line-height: 1.35;
  padding: 2px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  cursor: pointer;
  border: none;
  text-align: left;
  font-family: inherit;
  width: 100%;
  transition: opacity 0.1s, transform 0.1s;
}

.ev-chip:hover   { opacity: 0.75; transform: translateY(-1px); }
.ev-chip.selected { outline: 2px solid currentColor; outline-offset: 1px; }

/* 오른쪽 패널 공통 */
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.73rem;
  color: var(--muted);
  cursor: pointer;
  padding: 12px 16px;
  border: none;
  border-bottom: 1px solid var(--border-light);
  background: #fafaf8;
  font-family: inherit;
  width: 100%;
  text-align: left;
  transition: color 0.1s;
}

.back-btn:hover { color: var(--text); }

.panel-inner { padding: 18px 16px; }

.panel-date-tag  { font-size: 0.68rem; color: var(--muted); margin-bottom: 5px; }
.panel-org-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 7px;
}

.panel-course-label { font-size: 0.68rem; color: var(--hint); margin-bottom: 1px; }
.panel-title        { font-size: 0.95rem; font-weight: 700; line-height: 1.5; margin-bottom: 14px; letter-spacing: -0.01em; }

.panel-meta-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-light);
}

.panel-meta-row  { display: flex; gap: 8px; font-size: 0.73rem; }
.panel-meta-key  { color: var(--hint); width: 32px; flex-shrink: 0; }
.panel-meta-val  { color: var(--text); line-height: 1.5; }

.section-title {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 9px;
}

.session-list   { display: flex; flex-direction: column; gap: 8px; }

.session-item {
  padding: 9px 11px;
  border-radius: 7px;
  border: 1px solid var(--border-light);
  background: var(--bg);
}

.session-item.active-session { border-width: 1.5px; }

.session-row1 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.session-num {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
}

.session-date    { font-size: 0.65rem; color: var(--muted); }
.session-time    { font-size: 0.62rem; color: var(--hint); margin-left: auto; }
.session-subject { font-size: 0.76rem; font-weight: 500; line-height: 1.4; margin-bottom: 3px; }
.session-sub     { font-size: 0.65rem; color: var(--muted); line-height: 1.4; }
.session-instructor { font-size: 0.65rem; color: var(--hint); margin-top: 4px; }

.date-divider {
  font-size: 0.62rem;
  color: var(--hint);
  padding: 6px 0 3px;
  border-top: 1px solid var(--border-light);
  margin-top: 4px;
}

/* 전체 과정 목록 */
.all-courses { padding: 16px 14px; }

.all-courses-title {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}

.course-card {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  margin-bottom: 7px;
  cursor: pointer;
  transition: background 0.1s;
}

.course-card:hover { background: #eeeee9; }

.course-card-top {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 3px;
}

.course-card-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
}

.course-card-name { font-size: 0.78rem; font-weight: 700; }
.course-card-meta { font-size: 0.65rem; color: var(--muted); }

/* 기본 placeholder */
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 2rem;
  text-align: center;
  gap: 8px;
}

.placeholder p { font-size: 0.75rem; color: var(--hint); line-height: 1.7; }

@media (max-width: 680px) {
  .layout { flex-direction: column; height: auto; }
  .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
  .right-panel { width: 100%; }
}
</style>
</head>

  <p>마포구사회적경제통합지원센터 · 2025년 6–8월</p>

  <div class="right-panel" id="right-panel"></div>

</div>

function mk(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function getDays(y,m){ return new Date(y,m,0).getDate(); }
function getFirst(y,m){ return new Date(y,m-1,1).getDay(); }

/* ── 카테고리 필터 클릭 ── */
function filterCourse(key, btn){
  // 이미 활성화된 버튼 클릭 시 해제
  if(btn.classList.contains('active')){
    btn.classList.remove('active');
    btn.style.background = '';
    renderAllCourses();
    return;
  }
  // 다른 버튼 비활성화
  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
  });
  // 선택 버튼 활성화
  btn.classList.add('active');
  btn.style.background = CAT_COLORS[key].bg;

  // 해당 기관의 첫 번째 과정 상세 표시
  const idx = COURSES.findIndex(c=>c.key===key);
  if(idx !== -1) openCourse(idx);
}

/* ── 월 탭 ── */
function showMonth(m, btn){
  currentMonth = m;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCal(m);
}

/* ── 캘린더 렌더 ── */
function renderCal(month){
  const y=2025, total=getDays(y,month), first=getFirst(y,month), prevTotal=getDays(y,month-1);
  const body=document.getElementById('cal-body');
  body.innerHTML='';

  for(let i=0;i<first;i++){
    const cell=mk('div','cal-cell other');
    const dn=mk('div','day-num other'); dn.textContent=prevTotal-first+1+i;
    cell.appendChild(dn); body.appendChild(cell);
  }

  for(let d=1;d<=total;d++){
    const dow=(first+d-1)%7;
    const cell=mk('div','cal-cell');
    const dn=mk('div','day-num'+(dow===0?' sun':dow===6?' sat':''));
    dn.textContent=d; cell.appendChild(dn);

    EVENTS.filter(e=>e.month===month&&e.day===d).forEach(ev=>{
      const co=COURSES[ev.ci], col=COL[co.key];
      const chip=document.createElement('button');
      chip.className='ev-chip';
      chip.style.cssText=`background:${col.bg};color:${col.tc};border:0.5px solid ${col.bd}66;`;
      chip.textContent=ev.label;
      chip.dataset.evKey = `${ev.month}-${ev.day}-${ev.ci}-${ev.si}`;
      chip.onclick=()=>selectEvent(ev, month, d, chip);
      cell.appendChild(chip);
    });

    body.appendChild(cell);
  }

  const used=first+total, remain=(7-(used%7))%7;
  for(let i=1;i<=remain;i++){
    const cell=mk('div','cal-cell other');
    const dn=mk('div','day-num other'); dn.textContent=i;
    cell.appendChild(dn); body.appendChild(cell);
  }
}

/* ── 캘린더 칩 선택 ── */
function selectEvent(ev, month, day, chip){
  if(selectedChip) selectedChip.classList.remove('selected');
  selectedChip=chip; chip.classList.add('selected');
  const co=COURSES[ev.ci], col=COL[co.key];
  const dow=WD[new Date(2025,month-1,day).getDay()];
  renderDetail(co, col, ev.si, `${month}월 ${day}일 (${dow})`);
}

/* ── 세션 클릭 → 달력으로 점프 ── */
function jumpToSession(co, sessionIdx){
  // 해당 세션의 날짜로 달력 이동
  const ev = EVENTS.find(e => {
    const c = COURSES[e.ci];
    return c === co && e.si === sessionIdx;
  });
  if(!ev) return;

  // 해당 월 탭 활성화
  const monthBtns = document.querySelectorAll('.month-btn');
  monthBtns.forEach(b=>{
    const mo = parseInt(b.textContent);
    b.classList.toggle('active', mo === ev.month);
  });
  currentMonth = ev.month;
  renderCal(ev.month);

  // 칩 찾아서 선택 상태로
  setTimeout(()=>{
    const key = `${ev.month}-${ev.day}-${ev.ci}-${ev.si}`;
    const chip = document.querySelector(`.ev-chip[data-ev-key="${key}"]`);
    if(chip){
      if(selectedChip) selectedChip.classList.remove('selected');
      selectedChip = chip;
      chip.classList.add('selected');
      chip.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }, 60);
}

/* ── 상세 패널 렌더 ── */
function renderDetail(co, col, activeIdx, dateStr){
  const rp=document.getElementById('right-panel');
  const coIdx = COURSES.indexOf(co);

  let sessionsHTML='';
  let prevDate='';
  co.sessions.forEach((s,i)=>{
    const isActive=(i===activeIdx);
    const hasCalEvent = EVENTS.some(e=>COURSES[e.ci]===co && e.si===i);
    if(s.date!==prevDate && s.label){
      if(i>0) sessionsHTML+=`<div class="date-divider">${s.date}</div>`;
      prevDate=s.date;
    }
    sessionsHTML+=`
    <div class="session-item${isActive?' active-session':''}"
         style="${isActive?`border-color:${col.bd};background:${col.bg}30;`:''}"
         onclick="${hasCalEvent?`jumpToSession(COURSES[${coIdx}],${i})`:'void(0)'}">
      <div class="session-row1">
        ${s.label?`<span class="session-num" style="background:${col.bg};color:${col.tc};">${s.label}</span>`:''}
        ${!s.label&&s.date?`<span class="session-date">${s.date}</span>`:''}
        ${s.time!=='—'?`<span class="session-time">${s.time}</span>`:''}
        ${hasCalEvent&&!isActive?`<span style="margin-left:auto;font-size:0.6rem;color:${col.tc};opacity:0.6;">📅 달력 보기</span>`:''}
      </div>
      <div class="session-subject">${s.subject}</div>
      ${s.sub?`<div class="session-sub">${s.sub}</div>`:''}
      ${s.instructor&&s.instructor!=='—'?`<div class="session-instructor">강사: ${s.instructor}</div>`:''}
    </div>`;
  });

  const descHTML = co.desc
    ? `<div class="panel-desc">${co.desc}</div>`
    : `<div class="panel-desc-placeholder">기관 소개글을 입력해 주세요</div>`;

  rp.innerHTML=`
    <button class="back-btn" onclick="renderAllCourses()">← 전체 과정 목록</button>
    <div class="panel-inner">
      <div class="panel-date-tag">${dateStr}</div>
      <span class="panel-org-badge" style="background:${col.bg};color:${col.tc};">${co.org}</span>
      <div class="panel-course-label">과정명</div>
      <div class="panel-title">${co.name}</div>
      ${descHTML}
      <div class="panel-meta-list">
        ${Object.entries(co.meta).map(([k,v])=>`
          <div class="panel-meta-row">
            <span class="panel-meta-key">${k}</span>
            <span class="panel-meta-val">${v}</span>
          </div>`).join('')}
      </div>
      <div class="section-title">전체 커리큘럼</div>
      <div class="session-list">${sessionsHTML}</div>
    </div>`;

  setTimeout(()=>{
    const active=rp.querySelector('.active-session');
    if(active) active.scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

/* ── 전체 과정 목록 ── */

  if(selectedChip){ selectedChip.classList.remove('selected'); selectedChip=null; }

  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
  });
  const rp=document.getElementById('right-panel');

  rp.innerHTML=`<div class="all-courses">
    <div class="all-courses-title">전체 과정 목록</div>
    ${COURSES.map((co,i)=>{
      const col=COL[co.key];
      return `<div class="course-card" onclick="openCourse(${i})">
        <div class="course-card-top">
          <span class="course-card-badge" style="background:${col.bg};color:${col.tc};">${co.org}</span>
          <span class="course-card-name">${co.name}</span>
        </div>
        <div class="course-card-meta">${co.meta['정원']} · ${co.meta['일정']} · ${co.meta['장소']}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ── 과정 열기 ── */
function openCourse(idx){
  const co=COURSES[idx], col=COL[co.key];
  renderDetail(co, col, -1, '과정 전체 일정');
  // 카테고리 탭 해당 기관 활성화
  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
  });
  const btn = document.getElementById('cat-'+co.key);
  if(btn){
    btn.classList.add('active');
    btn.style.background = CAT_COLORS[co.key].bg;
  }
}
