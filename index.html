<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마포 돌봄 캠퍼스</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root {
  --ulim:         #0F6E56; --ulim-bg:   #E1F5EE; --ulim-bd:   #5DCAA5;
  --sabujak:      #3C3489; --sabujak-bg:#EEEDFE; --sabujak-bd:#AFA9EC;
  --woori:        #633806; --woori-bg:  #FAEEDA; --woori-bd:  #EF9F27;
  --saenghyup:    #27500A; --saenghyup-bg:#EAF3DE;--saenghyup-bd:#97C459;
  --common:       #0C447C; --common-bg: #E6F1FB; --common-bd: #85B7EB;
  --mapo:         #8B1A4A; --mapo-bg:   #FDE8F0; --mapo-bd:   #E07AAF;
  --border:       #e4e4e0;
  --border-light: #f0f0ec;
  --text:         #1a1a1a;
  --muted:        #6b7280;
  --hint:         #9ca3af;
  --bg:           #f5f5f2;
  --white:        #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.top-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 13px 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.top-bar h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
.top-bar p  { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

.top-nav { display: flex; gap: 4px; flex: 1; margin-left: 14px; }
.top-nav-btn {
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--white);
  font-size: 0.72rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.15s;
  white-space: nowrap;
}
.top-nav-btn:hover { background: #f0f0ec; color: var(--text); }
.top-nav-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

/* 기관 소개 페이지 */
#page-orgs { display: none; padding: 24px 28px; max-width: 900px; margin: 0 auto; }

.orgs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 8px;
}

.org-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.1s;
}
.org-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }

.org-card-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-light);
}
.org-card-badge {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 7px;
}
.org-card-name { font-size: 0.9rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
.org-card-body { padding: 12px 16px; }
.org-card-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
.org-card-courses-label { font-size: 0.62rem; color: var(--hint); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.org-course-pill {
  display: inline-block;
  font-size: 0.63rem;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid;
  margin: 2px 2px 2px 0;
  font-weight: 500;
}
.org-card-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border-light);
  font-size: 0.65rem;
  color: var(--hint);
  background: var(--bg);
}

/* 기관 상세 모달/패널 */
.org-detail-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.org-detail-overlay.open { display: flex; }
.org-detail-panel {
  background: var(--white);
  border-radius: 14px;
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
}
.org-detail-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border-light);
  position: sticky; top: 0; background: var(--white);
  display: flex; align-items: flex-start; gap: 10px;
}
.org-detail-header-text { flex: 1; }
.org-detail-close {
  background: none; border: none; font-size: 1.1rem; cursor: pointer;
  color: var(--muted); padding: 2px 4px; border-radius: 4px; flex-shrink: 0;
  line-height: 1;
}
.org-detail-close:hover { color: var(--text); background: var(--bg); }
.org-detail-body { padding: 18px 20px 24px; }
.org-detail-section { margin-bottom: 18px; }
.org-detail-section-title {
  font-size: 0.65rem; font-weight: 700; color: var(--hint);
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
}
.org-detail-desc { font-size: 0.78rem; line-height: 1.8; color: var(--text); }
.org-detail-info-row { display: flex; gap: 8px; font-size: 0.73rem; margin-bottom: 5px; }
.org-detail-info-key { color: var(--hint); width: 42px; flex-shrink: 0; }
.org-detail-info-val { color: var(--text); line-height: 1.5; }
.org-go-schedule-btn {
  display: block; width: 100%;
  padding: 11px 0; text-align: center;
  border-radius: 8px; border: none;
  font-family: inherit; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; color: #fff;
  transition: opacity 0.15s;
  margin-top: 4px;
}
.org-go-schedule-btn:hover { opacity: 0.85; }

.layout {
  display: flex;
  height: calc(100vh - 49px);
}

/* 왼쪽 캘린더 */
.left-panel {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 18px 40px;
  border-right: 1px solid var(--border);
}

/* 오른쪽 패널 */
.right-panel {
  width: 420px;
  flex-shrink: 0;
  overflow-y: auto;
  background: var(--white);
}

/* 범례 / 카테고리 탭 */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.78rem;
  color: var(--muted);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 11px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.legend-item:hover { background: #f0f0ec; color: var(--text); }
.legend-item.active { color: var(--white); border-color: transparent; }

.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* 기관 소개글 */
.panel-desc {
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.7;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 7px;
  border: 1px solid var(--border-light);
  margin-bottom: 14px;
  font-style: italic;
}

.panel-desc-placeholder {
  font-size: 0.78rem;
  color: var(--hint);
  line-height: 1.6;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 7px;
  border: 1px dashed var(--border);
  margin-bottom: 14px;
  text-align: center;
}

/* 세션 클릭 */
.session-item { cursor: pointer; }
.session-item:hover:not(.active-session) { background: #eeeee9; }
.month-nav { display: flex; gap: 5px; margin-bottom: 10px; align-items: center; }

.month-year {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: 0.04em;
  padding: 5px 8px 5px 2px;
  margin-right: 2px;
  border-right: 1px solid var(--border);
}

.month-btn {
  padding: 5px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--white);
  font-size: 0.78rem;
  font-family: inherit;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.1s;
}

.month-btn:hover { background: #f0f0ec; }
.month-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

/* 캘린더 */
.cal-wrap {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.cal-head-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: #fafaf8;
  border-bottom: 1px solid var(--border);
}

.cal-head-cell {
  padding: 8px 0;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--muted);
}

.cal-head-cell.sun { color: #dc2626; }
.cal-head-cell.sat { color: #2563eb; }

.cal-body-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-cell {
  min-height: 90px;
  border-right: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  padding: 5px;
}

.cal-cell:nth-child(7n) { border-right: none; }
.cal-cell.other { background: #fafaf9; }

.day-num {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--muted);
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  margin-bottom: 3px;
}

.day-num.sun   { color: #dc2626; }
.day-num.sat   { color: #2563eb; }
.day-num.other { color: #d1d5db; }

.ev-chip {
  display: block;
  font-size: 0.7rem;
  line-height: 1.35;
  padding: 2px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  cursor: pointer;
  border: none;
  text-align: left;
  font-family: inherit;
  width: 100%;
  transition: opacity 0.1s, transform 0.1s;
}

.ev-chip:hover   { opacity: 0.75; transform: translateY(-1px); }
.ev-chip.selected { outline: 2px solid currentColor; outline-offset: 1px; }

/* 오른쪽 패널 공통 */
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--muted);
  cursor: pointer;
  padding: 12px 16px;
  border: none;
  border-bottom: 1px solid var(--border-light);
  background: #fafaf8;
  font-family: inherit;
  width: 100%;
  text-align: left;
  transition: color 0.1s;
}

.back-btn:hover { color: var(--text); }

.panel-inner { padding: 18px 16px; }

.panel-date-tag  { font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
.panel-org-badge {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 7px;
}

.panel-course-label { font-size: 0.78rem; color: var(--hint); margin-bottom: 1px; }
.panel-title        { font-size: 1.05rem; font-weight: 700; line-height: 1.5; margin-bottom: 14px; letter-spacing: -0.01em; }

.panel-meta-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-light);
}

.panel-meta-row  { display: flex; gap: 8px; font-size: 0.82rem; }
.panel-meta-key  { color: var(--hint); width: 36px; flex-shrink: 0; }
.panel-meta-val  { color: var(--text); line-height: 1.5; }

.section-title {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 9px;
}

.session-list   { display: flex; flex-direction: column; gap: 8px; }

.session-item {
  padding: 9px 11px;
  border-radius: 7px;
  border: 1px solid var(--border-light);
  background: var(--bg);
}

.session-item.active-session { border-width: 1.5px; }

.session-row1 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.session-num {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
}

.session-date    { font-size: 0.74rem; color: var(--muted); }
.session-time    { font-size: 0.7rem; color: var(--hint); margin-left: auto; }
.session-subject { font-size: 0.84rem; font-weight: 500; line-height: 1.4; margin-bottom: 3px; }
.session-sub     { font-size: 0.74rem; color: var(--muted); line-height: 1.4; }
.session-instructor { font-size: 0.74rem; color: var(--hint); margin-top: 4px; }

.date-divider {
  font-size: 0.7rem;
  color: var(--hint);
  padding: 6px 0 3px;
  border-top: 1px solid var(--border-light);
  margin-top: 4px;
}

/* 전체 과정 목록 */
.all-courses { padding: 16px 14px; }

.all-courses-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--hint);
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}

.course-card {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  margin-bottom: 7px;
  cursor: pointer;
  transition: background 0.1s;
}

.course-card:hover { background: #eeeee9; }

.course-card-top {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 3px;
  flex-wrap: nowrap;
}

.course-card-badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.course-card-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.course-card-meta { font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 신청하기 버튼 */
.apply-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 10px 0;
  border-radius: 8px;
  border: none;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  margin-top: 16px;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: -0.01em;
}
.apply-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.apply-btn:active { transform: translateY(0); }
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 2rem;
  text-align: center;
  gap: 8px;
}

.placeholder p { font-size: 0.75rem; color: var(--hint); line-height: 1.7; }

/* 기관 카드 균일 높이 */
.org-card {
  display: flex;
  flex-direction: column;
}
.org-card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.org-card-desc {
  flex: 1;
  min-height: 72px;
}

/* ── 모바일 대응 ── */
@media (max-width: 860px) {
  .right-panel { width: 320px; }
}

@media (max-width: 680px) {
  /* 상단바 */
  .top-bar {
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
  }
  .top-bar h1 {
    font-size: 0.88rem;
    width: 100%;
  }
  .top-nav {
    margin-left: 0;
    width: 100%;
    flex: none;
  }
  .top-nav-btn {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    padding: 6px 8px;
  }

  /* 레이아웃: 세로 쌓기 */
  .layout {
    flex-direction: column;
    height: auto;
  }
  .left-panel {
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 12px 12px 24px;
  }
  .right-panel {
    width: 100%;
    max-height: 60vh;
    overflow-y: auto;
  }

  /* 달력 셀 높이 줄이기 */
  .cal-cell { min-height: 60px; }

  /* 기관 소개 그리드: 1열 */
  .orgs-grid {
    grid-template-columns: 1fr;
  }

  /* 모달 패딩 줄이기 */
  .org-detail-overlay { padding: 12px; }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>돌봄을 다시 잇다 &lt;마포 돌봄 캠퍼스&gt;</h1>
  <nav class="top-nav">
    <button class="top-nav-btn active" id="nav-schedule" onclick="switchPage('schedule', this)">📅 교육일정</button>
    <button class="top-nav-btn" id="nav-orgs" onclick="switchPage('orgs', this)">🏢 기관 소개</button>
  </nav>
</div>

<div class="layout">

  <div class="left-panel">
    <div class="legend">
      <button class="legend-item active" id="cat-all" onclick="showAll(this)" style="background:var(--text);color:var(--white);border-color:transparent;">전체보기</button>
      <button class="legend-item" id="cat-ulim"      onclick="filterCourse('ulim',this)"     style=""><div class="legend-dot" style="background:var(--ulim-bg);border:1px solid var(--ulim-bd);"></div>울림두레돌봄사협 — 성인단기돌봄 / 홈케어</button>
      <button class="legend-item" id="cat-sabujak"   onclick="filterCourse('sabujak',this)"  style=""><div class="legend-dot" style="background:var(--sabujak-bg);border:1px solid var(--sabujak-bd);"></div>사부작 — 길동무과정</button>
      <button class="legend-item" id="cat-woori"     onclick="filterCourse('woori',this)"    style=""><div class="legend-dot" style="background:var(--woori-bg);border:1px solid var(--woori-bd);"></div>우리동물병원생명사협 — 반려동물통합돌봄</button>
      <button class="legend-item" id="cat-saenghyup" onclick="filterCourse('saenghyup',this)" style=""><div class="legend-dot" style="background:var(--saenghyup-bg);border:1px solid var(--saenghyup-bd);"></div>울림두레소비자생협 — 커뮤니티 밥상 기획</button>
      <button class="legend-item" id="cat-mapo"      onclick="filterCourse('mapo',this)"     style=""><div class="legend-dot" style="background:var(--mapo-bg);border:1px solid var(--mapo-bd);"></div>마포의료복지사협 — 노인건강돌봄지도사</button>
      <button class="legend-item" id="cat-common"    onclick="filterCourse('common',this)"   style=""><div class="legend-dot" style="background:var(--common-bg);border:1px solid var(--common-bd);"></div>공통과정 — 사전돌봄의향서</button>
    </div>

    <div class="month-nav">
      <span class="month-year">2026</span>
      <button class="month-btn active" onclick="showMonth(6,this)">6월</button>
      <button class="month-btn" onclick="showMonth(7,this)">7월</button>
      <button class="month-btn" onclick="showMonth(8,this)">8월</button>
    </div>

    <div class="cal-wrap">
      <div class="cal-head-row">
        <div class="cal-head-cell sun">일</div>
        <div class="cal-head-cell">월</div>
        <div class="cal-head-cell">화</div>
        <div class="cal-head-cell">수</div>
        <div class="cal-head-cell">목</div>
        <div class="cal-head-cell">금</div>
        <div class="cal-head-cell sat">토</div>
      </div>
      <div class="cal-body-grid" id="cal-body"></div>
    </div>
    <div id="cal-footer-logo" style="padding:16px 12px 20px;text-align:center;border-top:1px solid var(--border-light);margin-top:8px;"></div>
  </div>

  <div class="right-panel" id="right-panel"></div>

</div>

<!-- 기관 소개 페이지 -->
<div id="page-orgs"></div>

<!-- 기관 상세 모달 -->
<div class="org-detail-overlay" id="org-overlay" onclick="closeOrgDetail(event)">
  <div class="org-detail-panel" id="org-detail-panel"></div>
</div>

<script>
const COL = {
  center:    {bg:'#F0F0EB',tc:'#3D3D3D',bd:'#AAAAAA'},
  ulim:      {bg:'#E1F5EE',tc:'#085041',bd:'#5DCAA5'},
  sabujak:   {bg:'#EEEDFE',tc:'#3C3489',bd:'#AFA9EC'},
  woori:     {bg:'#FAEEDA',tc:'#633806',bd:'#EF9F27'},
  saenghyup: {bg:'#EAF3DE',tc:'#27500A',bd:'#97C459'},
  common:    {bg:'#E6F1FB',tc:'#0C447C',bd:'#85B7EB'},
  mapo:      {bg:'#FDE8F0',tc:'#8B1A4A',bd:'#E07AAF'},
};

const WD = ['일','월','화','수','목','금','토'];

function mk(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function getDays(y,m){ return new Date(y,m,0).getDate(); }
function getFirst(y,m){ return new Date(y,m-1,1).getDay(); }

/* ── 전체보기 ── */
function showAll(btn){
  activeFilterKey = null;
  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = '';
  });
  btn.classList.add('active');
  btn.style.background = 'var(--text)';
  btn.style.color = 'var(--white)';
  btn.style.borderColor = 'transparent';
  renderCal(currentMonth);
  renderAllCourses();
}

/* ── 카테고리 필터 클릭 ── */
function filterCourse(key, btn){
  // 이미 활성화된 버튼 클릭 시 전체보기로 복귀
  if(activeFilterKey === key){
    showAll(document.getElementById('cat-all'));
    return;
  }
  activeFilterKey = key;

  // 모든 버튼 초기화
  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = '';
  });
  // 전체보기 버튼 비활성화 스타일
  const allBtn = document.getElementById('cat-all');
  allBtn.style.background = '';
  allBtn.style.color = '';
  allBtn.style.borderColor = '';

  // 선택 버튼 활성화
  btn.classList.add('active');
  btn.style.background = CAT_COLORS[key].bg;

  // 달력 해당 과정만 표시
  renderCal(currentMonth);

  // 해당 기관의 첫 번째 과정 상세 표시
  const idx = COURSES.findIndex(c=>c.key===key);
  if(idx !== -1) openCourse(idx);
}

/* ── 월 탭 ── */
function showMonth(m, btn){
  currentMonth = m;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCal(m);
}

/* ── 캘린더 렌더 (필터 적용) ── */
function renderCal(month){
  const y=2026, total=getDays(y,month), first=getFirst(y,month), prevTotal=getDays(y,month-1);
  const body=document.getElementById('cal-body');
  body.innerHTML='';

  // 현재 필터에 맞는 이벤트만 추출
  const visibleEvents = activeFilterKey
    ? EVENTS.filter(e => COURSES[e.ci].key === activeFilterKey)
    : EVENTS;

  for(let i=0;i<first;i++){
    const cell=mk('div','cal-cell other');
    const dn=mk('div','day-num other'); dn.textContent=prevTotal-first+1+i;
    cell.appendChild(dn); body.appendChild(cell);
  }

  for(let d=1;d<=total;d++){
    const dow=(first+d-1)%7;
    const cell=mk('div','cal-cell');
    const dn=mk('div','day-num'+(dow===0?' sun':dow===6?' sat':''));
    dn.textContent=d; cell.appendChild(dn);

    visibleEvents.filter(e=>e.month===month&&e.day===d).forEach(ev=>{
      const co=COURSES[ev.ci], col=COL[co.key];
      const chip=document.createElement('button');
      chip.className='ev-chip';
      chip.style.cssText=`background:${col.bg};color:${col.tc};border:0.5px solid ${col.bd}66;`;
      chip.textContent=ev.label;
      chip.dataset.evKey = `${ev.month}-${ev.day}-${ev.ci}-${ev.si}`;
      chip.onclick=()=>selectEvent(ev, month, d, chip);
      cell.appendChild(chip);
    });

    body.appendChild(cell);
  }

  const used=first+total, remain=(7-(used%7))%7;
  for(let i=1;i<=remain;i++){
    const cell=mk('div','cal-cell other');
    const dn=mk('div','day-num other'); dn.textContent=i;
    cell.appendChild(dn); body.appendChild(cell);
  }
}

/* ── 캘린더 칩 선택 ── */
function selectEvent(ev, month, day, chip){
  if(selectedChip) selectedChip.classList.remove('selected');
  selectedChip=chip; chip.classList.add('selected');
  const co=COURSES[ev.ci], col=COL[co.key];
  const dow=WD[new Date(2026,month-1,day).getDay()];
  renderDetail(co, col, ev.si, `${month}월 ${day}일 (${dow})`);
}

/* ── 세션 클릭 → 달력으로 점프 ── */
function jumpToSession(co, sessionIdx){
  const ev = EVENTS.find(e => {
    const c = COURSES[e.ci];
    return c === co && e.si === sessionIdx;
  });
  if(!ev) return;

  const monthBtns = document.querySelectorAll('.month-btn');
  monthBtns.forEach(b=>{
    const mo = parseInt(b.textContent);
    b.classList.toggle('active', mo === ev.month);
  });
  currentMonth = ev.month;
  renderCal(ev.month);

  setTimeout(()=>{
    const key = `${ev.month}-${ev.day}-${ev.ci}-${ev.si}`;
    const chip = document.querySelector(`.ev-chip[data-ev-key="${key}"]`);
    if(chip){
      if(selectedChip) selectedChip.classList.remove('selected');
      selectedChip = chip;
      chip.classList.add('selected');
      chip.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }, 60);
}

/* ── 상세 패널 렌더 ── */
function renderDetail(co, col, activeIdx, dateStr){
  const rp=document.getElementById('right-panel');
  const coIdx = COURSES.indexOf(co);

  let sessionsHTML='';
  let prevDate='';
  co.sessions.forEach((s,i)=>{
    const isActive=(i===activeIdx);
    const hasCalEvent = EVENTS.some(e=>COURSES[e.ci]===co && e.si===i);
    if(s.date!==prevDate && s.label){
      if(i>0) sessionsHTML+=`<div class="date-divider">${s.date}</div>`;
      prevDate=s.date;
    }
    sessionsHTML+=`
    <div class="session-item${isActive?' active-session':''}"
         style="${isActive?`border-color:${col.bd};background:${col.bg}30;`:''}"
         onclick="${hasCalEvent?`jumpToSession(COURSES[${coIdx}],${i})`:'void(0)'}">
      <div class="session-row1">
        ${s.label?`<span class="session-num" style="background:${col.bg};color:${col.tc};">${s.label}</span>`:''}
        ${!s.label&&s.date?`<span class="session-date">${s.date}</span>`:''}
        ${s.time!=='—'?`<span class="session-time">${s.time}</span>`:''}
        ${hasCalEvent&&!isActive?`<span style="margin-left:auto;font-size:0.6rem;color:${col.tc};opacity:0.6;">📅 달력 보기</span>`:''}
      </div>
      <div class="session-subject">${s.subject}</div>
      ${s.sub?`<div class="session-sub">${s.sub}</div>`:''}
      ${s.instructor&&s.instructor!=='—'?`<div class="session-instructor">강사: ${s.instructor}</div>`:''}
    </div>`;
  });

  const descHTML = co.desc
    ? `<div class="panel-desc">${co.desc}</div>`
    : `<div class="panel-desc-placeholder">기관 소개글을 입력해 주세요</div>`;

  const applyUrl = APPLY_LINKS[co.key];
  const applyHTML = applyUrl
    ? `<a class="apply-btn" href="${applyUrl}" target="_blank" rel="noopener"
          style="background:${col.tc};color:#fff;">
         ✏️ 신청하기
       </a>`
    : '';

  rp.innerHTML=`
    <button class="back-btn" onclick="renderAllCourses()">← 전체 과정 목록</button>
    <div class="panel-inner">
      <div class="panel-date-tag">${dateStr}</div>
      <span class="panel-org-badge" style="background:${col.bg};color:${col.tc};">${co.org}</span>
      <div class="panel-course-label">과정명</div>
      <div class="panel-title">${co.name}</div>
      ${descHTML}
      <div class="panel-meta-list">
        ${Object.entries(co.meta).map(([k,v])=>`
          <div class="panel-meta-row">
            <span class="panel-meta-key">${k}</span>
            <span class="panel-meta-val">${v}</span>
          </div>`).join('')}
      </div>
      ${applyHTML}
      <div class="section-title" style="margin-top:16px;">전체 커리큘럼</div>
      <div class="session-list">${sessionsHTML}</div>
    </div>`;

  setTimeout(()=>{
    const active=rp.querySelector('.active-session');
    if(active) active.scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

/* ── 전체 과정 목록 ── */
function renderAllCourses(){
  if(selectedChip){ selectedChip.classList.remove('selected'); selectedChip=null; }
  const rp=document.getElementById('right-panel');

  rp.innerHTML=`<div class="all-courses">
    <div class="all-courses-title">전체 과정 목록</div>
    ${COURSES.map((co,i)=>{
      const col=COL[co.key];

      </div>`;
    }).join('')}
  </div>`;
}

/* ── 과정 열기 ── */
function openCourse(idx){
  const co=COURSES[idx], col=COL[co.key];
  renderDetail(co, col, -1, '과정 전체 일정');
  document.querySelectorAll('.legend-item').forEach(b=>{
    b.classList.remove('active');
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = '';
  });
  const btn = document.getElementById('cat-'+co.key);
  if(btn){
    btn.classList.add('active');
    btn.style.background = CAT_COLORS[co.key].bg;
  }
  // 달력도 해당 과정으로 필터
  activeFilterKey = co.key;
  renderCal(currentMonth);
}

          </div>`;
        }).join('')}
      </div>
      <div id="orgs-footer-logo"></div>
    </div>`;
  renderLogoEl('orgs-footer-logo');
  renderOrgsFooter();
}

/* ── 기관 상세 모달 ── */
function openOrgDetail(key){
  const org = ORGS.find(o => o.key === key);
  if(!org) return;
  const col = COL[org.key];
  const infoRows = Object.entries(org.info).map(([k,v])=>
    `<div class="org-detail-info-row">
       <span class="org-detail-info-key">${k}</span>
       <span class="org-detail-info-val">${v}</span>
     </div>`
  ).join('');

  const courseSection = org.courses.length > 0
    ? `<div class="org-detail-section">
        <div class="org-detail-section-title">운영 교육과정</div>
        <div style="margin-top:2px;">
          ${org.courses.map(c =>
            `<span class="org-course-pill" style="color:${col.tc};border-color:${col.bd};background:${col.bg};font-size:0.72rem;padding:3px 10px;">${c}</span>`
          ).join(' ')}
        </div>
       </div>`
    : '';

  const applyBtn = org.link
    ? `<a class="org-go-schedule-btn" href="${org.link}" target="_blank" rel="noopener"
          style="background:${col.tc};text-decoration:none;">✏️ 교육 신청하기</a>`
    : '';
  const websiteBtn = org.website
    ? `<a class="org-go-schedule-btn" href="${org.website}" target="_blank" rel="noopener"
          style="background:${col.tc};margin-top:8px;text-decoration:none;">🔗 홈페이지 방문하기</a>`
    : '';
  const scheduleBtn = org.courses.length > 0
    ? `<button class="org-go-schedule-btn"
        style="background:var(--text);margin-top:8px;"
        onclick="closeOrgDetail();switchPage('schedule',document.getElementById('nav-schedule'));setTimeout(()=>{const b=document.getElementById('cat-${org.key}');if(b)filterCourse('${org.key}',b);},100)">
        📅 교육일정에서 보기
      </button>`
    : '';

  document.getElementById('org-detail-panel').innerHTML = `
    <div class="org-detail-header">
      <div class="org-detail-header-text">
        <span class="org-card-badge" style="background:${col.bg};color:${col.tc};display:inline-block;font-size:0.62rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:6px;">${org.shortName}</span>
        <div style="font-size:0.95rem;font-weight:700;line-height:1.4;letter-spacing:-0.01em;">${org.name}</div>
      </div>
      <button class="org-detail-close" onclick="closeOrgDetail()">✕</button>
    </div>
    <div class="org-detail-body">
      <div class="org-detail-section">
        <div class="org-detail-section-title">기관 소개</div>
        <div class="org-detail-desc">${org.desc}</div>
      </div>
      <div class="org-detail-section">
        <div class="org-detail-section-title">기관 정보</div>
        ${infoRows}
      </div>
      ${courseSection}
      <div style="margin-top:20px;">
        ${applyBtn}
        ${scheduleBtn}
        ${websiteBtn}
      </div>
    </div>`;
  document.getElementById('org-overlay').classList.add('open');
}

function closeOrgDetail(e){
  if(e && e.target !== document.getElementById('org-overlay')) return;
  document.getElementById('org-overlay').classList.remove('open');
}
